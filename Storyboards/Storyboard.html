<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Andrea Valorani - Storyboard</title>   
        <link rel="stylesheet" href="Storyboard.css">  
    </head>
    <body>
        <div class="Wrapper">
            <image src="Elementi/Stoyboards_Title.png"></image>
            <div class="ButtonHolder">
                <a type="button" class="Button" href="../Home/Home.html">
                    <img src="../Home/Elementi/Tasto_Home.png"></img>
                </a>  
                <a type="button" class="Button" href="../Illustrations/Illustrations.html">
                    <img src="../Home/Elementi/Tasto_Illustration.png"></img>
                </a>  
                <a type="button" class="Button" href="../Password/Password.html">
                    <img src="../Home/Elementi/Tasto_Work.png"></img>
                </a>    
            </div>

            <div class="CarouselWrapper">
                <div class="VideoSelector">
                    <video width="320" height="240" controls class="Slide">
                        <source src="Elementi/Delta/Layout_Delta.mov" type="video/mp4">
                        Video non supportato dal tuo browser
                    </video>   
                    <video width="320" height="240" controls class="Slide">
                        <source src="Elementi/Delta/Story_Delta.mov" type="video/mp4">
                        Video non supportato dal tuo browser
                    </video>          
                </div>
                
                <div class="Controls">
                    <button class="ButtonChange BtnPrev">
                        <image src="../Work/Elementi/Works_ButtPrevious.png"></image> 
                    </button>
                    <button class="ButtonChange BtnNext">
                        <image src="../Work/Elementi/Works_ButtNext.png"></image> 
                    </button>
                </div>
                <image src="Elementi/Stoyboards_Box1.png"></image>
            </div>

            <div class="VideoSelector">
                <video width="320" height="240" controls>
                    <source src="Elementi/Nighturns_Story.mov" type="video/mp4">
                    Video non supportato dal tuo browser
                </video>      
            </div>
            <image src="Elementi/Stoyboards_Box2.png"></image>
            <image src="../Home/Elementi/Home_Piedipaggina.png" class="Footer"></image>
        </div>
        <script src="Storyboard.js"></script>
    </body>
</html>
